server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static healthcheck target shipped in the image.
  location = /health.txt {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Proxy API calls to the api service, stripping the /api prefix.
  # In docker-compose the upstream is `api`; on k8s set API_UPSTREAM to the
  # service name (e.g. tarot-api:3000).
  location /api/ {
    proxy_pass http://${API_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — every other path serves the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
